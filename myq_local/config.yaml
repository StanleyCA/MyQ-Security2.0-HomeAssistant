name: "myQ Local Bridge"
description: "Local TLS-PSK MQTT endpoint for myQ Security 2.0+ Devices"
version: "0.1.3"
slug: "myq_local"
startup: services
boot: auto
init: false
arch:
  - aarch64
  - amd64
services:
  - mqtt:need
ports:
  8883/tcp: 8883
ports_description:
  8883/tcp: "Device-facing TLS 1.2 PSK MQTT"
watchdog: "tcp://[HOST]:8883"
options:
  serial: null
  device_id: null
  psk: null
  name: "Garage Door"
  discovery_prefix: "homeassistant"
schema:
  serial: str
  device_id: str
  psk: password
  name: str
  discovery_prefix: str
